<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의하기 | FRUEN</title>
    <meta name="description" content="제품 문의, 제휴 문의 등 FRUEN에 궁금한 점을 남겨 주세요. 고객센터 080-742-2100.">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="./assets/images/logo.png" type="image/png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="FRUEN">
    <meta property="og:title" content="문의하기 | FRUEN">
    <meta property="og:description" content="제품 문의, 제휴 문의 등 FRUEN에 궁금한 점을 남겨 주세요.">
    <meta property="og:image" content="./assets/images/logo.png">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/component/font.css">
    <link rel="stylesheet" href="./assets/component/guide.css">
    <link rel="stylesheet" href="./assets/component/common.css">
    <link rel="stylesheet" href="./assets/component/header.css">
    <link rel="stylesheet" href="./assets/component/footer.css">
    <link rel="stylesheet" href="./assets/component/float-menu.css">
    <link rel="stylesheet" href="./assets/component/privacy-popup.css">
    <link rel="stylesheet" href="./assets/css/contact.css">
</head>

<body class="theme-header-light">
    <a class="skip-link" href="#main-content">본문 바로가기</a>

    <!-- 헤더 -->
    <div data-component="header"></div>
    <div data-component="privacy-popup"></div>

    <main id="main-content">
    <h1 class="visually-hidden">FRUEN 문의하기</h1>

    <!-- kv section -->
    <section class="kv-sec">
        <img src="./assets/images/sub-contact/img-contact-kv.png" alt="FRUEN 문의하기" fetchpriority="high" decoding="async">
        <div class="kv-title-wrap">
            <h2>CONTACT</h2>
            <p>FRUEN과<br>더 가까이 만나는 공간</p>
        </div>
    </section>

    <!-- CONTACT FORM -->
    <section class="contact-form-sec">

        <!-- 상담자 정보 -->
        <div class="contact-form-wrap">

            <div class="contact-title-wrap">
                <h2 class="main-title-2">상담자 정보</h2>
                <p>별도 표시는 필수 입력 항목입니다 *</p>
            </div>

            <!-- Form -->
            <form class="contact-form">

                <!-- 성함 -->
                <div class="form-row">
                    <label for="name">
                        <span>*</span>
                        성함
                    </label>

                    <input type="text" id="name" name="name" placeholder="성함" autocomplete="name" required>
                </div>


                <!-- 연락처 -->
                <div class="form-row">
                    <label for="tel">
                        <span>*</span>
                        연락처
                    </label>

                    <input type="tel" id="tel" name="tel" placeholder="연락처" autocomplete="tel" required>
                </div>


                <!-- 이메일 -->
                <div class="form-row">
                    <label for="email">
                        <span>*</span>
                        이메일
                    </label>

                    <input type="email" id="email" name="email" placeholder="이메일을 입력해 주세요." autocomplete="email" required>
                </div>


                <!-- 문의 유형 -->
                <div class="form-row">
                    <label for="inquiry">
                        <span>*</span>
                        문의 유형
                    </label>

                    <select id="inquiry" name="inquiry" required>
                        <option value="">문의 유형 선택</option>
                        <option value="product">제품 문의</option>
                        <option value="partnership">제휴 문의</option>
                        <option value="etc">기타 문의</option>
                    </select>
                </div>


                <!-- 문의 내용 -->
                <div class="form-message">
                    <label class="visually-hidden" for="message">문의 내용</label>
                    <textarea id="message" name="message" placeholder="문의 내용을 입력해주세요."></textarea>
                </div>


                <!-- 개인정보 동의 -->
                <div class="privacy-wrap">
                    <label class="privacy-check">
                        <input type="checkbox" name="privacy" required>

                        <span>
                            개인정보 수집 활용을 동의합니다.
                        </span>
                    </label>

                    <a href="#" class="js-privacy-popup-open">전문보기</a>
                </div>


                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    문의 등록하기
                </button>

            </form>


            <!-- Contact Image -->
            <div class="contact-img-wrap">

                <img src="./assets/images/sub-contact/contact-img.png" alt="FRUEN 스틱형 과일청 제품" loading="lazy" decoding="async">

            </div>

    </section>

    </main>

    <!-- Footer -->
    <div data-component="footer"></div>

    <script src="./assets/js/jquery-4.0.0.min.js"></script>
    <script src="./assets/component/components.js"></script>
    <script src="./assets/js/contact.js"></script>

</body>

</html>
