<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUEN : CONTACT</title>
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/component/font.css">
    <link rel="stylesheet" href="./assets/component/guide.css">
    <link rel="stylesheet" href="./assets/component/common.css">
    <link rel="stylesheet" href="./assets/component/header.css">
    <link rel="stylesheet" href="./assets/component/footer.css">
    <link rel="stylesheet" href="./assets/css/contact.css">
</head>

<body class="theme-header-light">

    <!-- 헤더 -->
    <div data-component="header"></div>


    <!-- kv section -->
    <section class="kv-sec">
        <img src="./assets/images/sub-contact/img-contact-kv.png" alt="kv 이미지">
        <div class="kv-title-wrap">
            <h2>CONTACT</h2>
            <p>FRUEN과<br>더 가까이 만나는 공간</p>
        </div>
    </section>

    <!-- CONTACT FORM -->
    <section class="contact-form-sec">

        <!-- 상담자 정보 -->
        <div class="contact-form-wrap">

            <div class="contact-title-wrap">
                <h2 class="main-title-2">상담자 정보</h2>
                <p>별도 표시는 필수 입력 항목입니다 *</p>
            </div>

            <!-- Form -->
            <form class="contact-form">

                <!-- 성함 -->
                <div class="form-row">
                    <label for="name">
                        <span>*</span>
                        성함
                    </label>

                    <input type="text" id="name" name="name" placeholder="성함" required>
                </div>


                <!-- 연락처 -->
                <div class="form-row">
                    <label for="tel">
                        <span>*</span>
                        연락처
                    </label>

                    <input type="tel" id="tel" name="tel" placeholder="연락처" required>
                </div>


                <!-- 이메일 -->
                <div class="form-row">
                    <label for="email">
                        <span>*</span>
                        이메일
                    </label>

                    <input type="email" id="email" name="email" placeholder="이메일을 입력해 주세요." required>
                </div>


                <!-- 문의 유형 -->
                <div class="form-row">
                    <label for="inquiry">
                        <span>*</span>
                        문의 유형
                    </label>

                    <select id="inquiry" name="inquiry" required>
                        <option value="">문의 유형 선택</option>
                        <option value="product">제품 문의</option>
                        <option value="partnership">제휴 문의</option>
                        <option value="etc">기타 문의</option>
                    </select>
                </div>


                <!-- 문의 내용 -->
                <div class="form-message">
                    <textarea id="message" name="message" placeholder="문의 내용을 입력해주세요."></textarea>
                </div>


                <!-- 개인정보 동의 -->
                <div class="privacy-wrap">
                    <label class="privacy-check">
                        <input type="checkbox" name="privacy" required>

                        <span>
                            개인정보 수집 활용을 동의합니다.
                        </span>
                    </label>

                    <a href="#">전문보기</a>
                </div>


                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    문의 등록하기
                </button>

            </form>


            <!-- Contact Image -->
            <div class="contact-img-wrap">

                <img src="./assets/images/sub-contact/contact-img.png" alt="FRUEN 제품 이미지">

            </div>

    </section>


    <!-- Footer -->
    <div data-component="footer"></div>

    <script src="/assets/js/jquery-4.0.0.min.js"></script>
    <script src="./assets/component/components.js"></script>
    <script src="/assets/js/contact.js"></script>

</body>

</html>
