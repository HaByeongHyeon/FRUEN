<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRUEN : BRAND</title>
    <link rel="stylesheet" href="./assets/css/reset.css">
    <link rel="stylesheet" href="./assets/component/font.css">
    <link rel="stylesheet" href="./assets/component/guide.css">
    <link rel="stylesheet" href="./assets/component/common.css">
    <link rel="stylesheet" href="./assets/component/header.css">
    <link rel="stylesheet" href="./assets/component/footer.css">
    <link rel="stylesheet" href="./assets/css/brand.css">
</head>

<body class="theme-header-light">

    <!-- 헤더 -->
    <div data-component="header"></div>



    <!-- kv section -->
    <section class="kv-sec">
        <img src="./assets/images/sub-brand/img-brand-kv.png" alt="kv 이미지">
        <div class="kv-title-wrap">
            <h2 class="main-title-1">입점 브랜드</h2>
            <p class="subtitle">FRUEN과<br>함께하는 스토어</p>
        </div>
    </section>


    <!-- 브랜드 -->
    <section class="brand-sec">
        <div class="container">
            <h2 class="brand main-title-1">
                전국 온오프라인 매장에서<br>
                FRUEN을 만나보세요.
            </h2>

            <div class="brand-wrap">
                <div class="online-brand">
                    <h3 class="brand section-title">ONLINE</h3>
                    <div class="brand-list">
                        <div class="online">
                            <img src="./assets/images/sub-brand/brand-online-1.png" alt="온라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-online-2.png" alt="온라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-online-3.png" alt="온라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-online-4.png" alt="온라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-online-5.png" alt="온라인 브랜드">
                        </div>
                    </div>
                </div>

                <div class="offline-brand">
                    <h3 class="section-title">OFFLINE</h3>
                    <div class="brand-list">
                        <div class="offline">
                            <img src="./assets/images/sub-brand/brand-offline-1.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-2.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-3.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-4.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-5.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-6.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-7.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-8.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-9.png" alt="오프라인 브랜드">
                            <img src="./assets/images/sub-brand/brand-offline-10.png" alt="오프라인 브랜드">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>


    <!-- Footer -->
    <div data-component="footer"></div>






    <script src="./assets/js/jquery-4.0.0.min.js"></script>
    <script src="./assets/component/components.js"></script>

</html>
