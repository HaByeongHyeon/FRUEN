<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRUEN STORY Animation Demo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#222;font-family:Arial,"Noto Sans KR",sans-serif;color:#111}
body{min-height:100vh}
.header{height:72px;position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(100%,1200px);z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 34px;color:#fff;background:rgba(80,70,65,.25);backdrop-filter:blur(5px)}
.logo{font-size:20px;letter-spacing:.3em}
.nav{display:flex;gap:28px;font-size:12px}
.nav span{opacity:.9}
.story{position:relative;width:min(100%,1200px);margin:0 auto;min-height:145vh;background:#fff4f4;overflow:hidden}
.hero{height:100vh;min-height:680px;position:sticky;top:0;overflow:hidden}
.strawberry{position:absolute;left:50%;top:-40px;width:100%;max-width:1100px;transform:translate(-50%,-18px) scale(.985);opacity:0;animation:strawberryIn 1.3s cubic-bezier(.2,.75,.25,1) .15s forwards, float 6s ease-in-out 1.5s infinite;filter:drop-shadow(0 18px 20px rgba(0,0,0,.10));will-change:transform}
.strawberry img{width:100%;display:block}
.overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,244,244,.05) 0%,rgba(255,244,244,.05) 35%,#fff4f4 78%,#fff4f4 100%);pointer-events:none}
.copy{position:absolute;left:12%;top:55%;z-index:2}
.copy h1{font-size:52px;line-height:1.05;margin:0 0 14px;font-weight:800;letter-spacing:-.04em;opacity:0;transform:translateY(24px);animation:copyIn .8s ease-out 1s forwards}
.copy p{font-size:20px;line-height:1.45;margin:0;opacity:0;transform:translateY(16px);animation:copyIn .7s ease-out 1.15s forwards}
@keyframes strawberryIn{from{opacity:0;transform:translate(-50%,-80px) scale(.94)}to{opacity:1;transform:translate(-50%,-18px) scale(.985)}}
@keyframes float{0%,100%{transform:translate(-50%,-18px) scale(.985)}50%{transform:translate(-50%,-24px) scale(.99)}}
@keyframes copyIn{to{opacity:1;transform:translateY(0)}}
.more{height:55vh;display:flex;align-items:center;justify-content:center;background:#fff4f4;font-size:18px;letter-spacing:.08em;color:#777}
.hint{position:fixed;right:28px;bottom:24px;background:#111;color:#fff;border-radius:999px;padding:11px 16px;font-size:12px;z-index:20;opacity:.8}
@media(max-width:700px){
.header{height:58px;padding:0 18px}
.nav{display:none}
.story{width:100%}
.copy{left:9%;top:58%}
.copy h1{font-size:36px}
.copy p{font-size:15px}
.strawberry{width:145%;max-width:none;left:50%;top:20px}
}
</style>
</head>

</header>
